apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropsFile = file('/cooledit-android-keystore/keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.cooledit.remotefs"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file('/cooledit-android-keystore/remotefs.keystore')
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.cooledit.remotefs"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"

        def buildTimeIso = java.time.Instant.now().toString()
        buildConfigField "String", "BUILD_TIME", "\"${buildTimeIso}\""

        externalNativeBuild {
            cmake {
                cFlags "-DSTANDALONE -DANDROID -DHAVE_STDLIB_H -DHAVE_STDIO_H -DHAVE_PWD_H -DHAVE_SYS_SELECT_H -DHAVE_SYS_IOCTL_H -DHAVE_FCNTL_H -DHAVE_SYS_STAT_H -DHAVE_UNISTD_H -DHAVE_STRING_H -DNDEBUG"
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    ndkVersion "28.2.13676358"
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.zxing:core:3.5.1'
}
